name: Frozen reproduction
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release containing the verified frozen inputs
        required: true
        default: v0.1.0-rc1
        type: string
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Create isolated environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install frozen Linux dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r environments/frozen-linux-py312.lock.txt
          python -m pip check
      - name: Download and verify frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "TrajRisk_frozen_inputs.zip" --pattern "SHA256SUMS" --dir build/downloads
          cd build/downloads
          sha256sum --check SHA256SUMS
      - name: Replay frozen models and supplementary figures
        run: bash scripts/reproduce_saved.sh build/downloads/TrajRisk_frozen_inputs.zip
      - name: Save reproduction reports and figures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-reproduction-results
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/frozen_replay/*.json
            build/frozen_replay/*.csv
            build/frozen_replay/*.npy
            build/figures/supplementary/*.pdf
